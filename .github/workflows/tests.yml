# The targets are Linux, macOS and Windows (and Termux, which cannot be
# checked here -- the pure-python job below is the part of it that can be).
#
# Until this existed, every cross-platform claim in the project rested on
# someone reading the code.
#
# Windows earns its place twice over. It is the platform where the paths,
# the console and the process handling all differ, and the one a Linux
# developer is least likely to notice breaking.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes the previous run's answer irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others -- knowing whether a
      # break is Windows-only or everywhere is most of the diagnosis.
      fail-fast: false
      matrix:
        # The README promises Linux, macOS, Windows and Termux, and the
        # tree carries real darwin branches (`open -a`, `say`, the Library
        # paths). Leaving macOS out of the matrix meant that promise was
        # never once checked.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        exclude:
          # macOS runners are the expensive ones, and a second interpreter
          # there buys little: the platform differences live in the paths and
          # the process handling, not in the Python version.
          - os: macos-latest
            python: "3.10"
        include:
          # The oldest and newest supported Python on every OS is more
          # matrix than this project needs; the ends are where breakage
          # lives, and Linux carries the middle.
          - os: ubuntu-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import on a clean interpreter
        # Catches a missing dependency that the test run would mask by
        # importing something else first.
        run: python -c "import wynxo, wynxo.cli, wynxo.agent, wynxo.provider"

      - name: Tests
        # The full Windows suite legitimately takes longer than the original
        # 150-second watchdog on hosted runners. Keep hang detection, but give
        # normal tmp-path/setup work enough headroom to finish.
        env:
          WYNXO_TEST_TIMEOUT: "360"
        run: python -m pytest -q

      - name: Where it hung
        # A hung suite is killed by the watchdog in tests/conftest.py, which
        # writes every thread's stack here. Without this the log shows a job
        # that stopped and nothing else.
        if: failure()
        shell: bash
        run: |
          if [ -f hang-traceback.txt ]; then
            echo "The suite hung. Stacks at the moment it was killed:"
            cat hang-traceback.txt
          else
            echo "No hang report -- the suite failed rather than hung."
          fi

      - name: The CLI actually starts
        # --version goes through argparse and every module-level import,
        # which is where a platform difference tends to surface first.
        run: wynxo --version

  lint:
    # Zero static checking meant the dead imports and undefined names were
    # only ever found by reading -- and the `__all__` entry that referenced
    # a deleted import shipped because nothing looked. This runs the F set
    # (pyflakes) on every push, which is exactly that class of bug.
    name: lint (ruff F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ruff
      - name: Lint
        run: ruff check wynxo tests

  coverage:
    # The test suite is green but the modules with no tests at all -- the
    # first-run wizard, the dictation backend, the edit-analysis helpers --
    # stay invisible unless someone looks. This job keeps the gap printed
    # on every run; it does not gate, because mid-refactor a green-but-
    # lower number is still an honest answer.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Measure coverage
        # Coverage instrumentation makes the full suite materially slower
        # than the normal matrix. Keep the watchdog, but give this job enough
        # headroom that a healthy instrumented run is not mistaken for a hang.
        env:
          WYNXO_TEST_TIMEOUT: "300"
        run: >
          python -m pytest -q --cov=wynxo
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  no-compiled-dependencies:
    # wynxo has to install on Termux, where anything needing a Rust or C
    # toolchain has no wheel and will not build. This is the check that
    # keeps a casual `pip install pydantic` from quietly ending that.
    name: pure python only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with binary wheels forbidden for our own tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Every installed distribution must be a pure-python wheel
        run: python .github/check_pure_python.py
