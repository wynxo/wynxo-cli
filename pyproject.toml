[project]
name = "wynxo"
version = "0.2.0"
description = "A local-first terminal AI assistant for Ollama: natural chat, coding, and agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.9", "pytest-cov>=5.0"]

[project.scripts]
wynxo = "wynxo.bootstrap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wynxo*"]

[tool.setuptools.package-data]
# The ASCII art is data, not code, so a wheel built without this ships
# without it: `logo.read()` swallows the resulting OSError, and the banner
# and the pet silently disappear for anyone who did not install from a
# git clone. Editable installs read straight from the tree, which is why
# nothing noticed.
wynxo = ["art/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# The F set (pyflakes) is the class of bug this project keeps tripping on:
# undefined names, unused imports, dangling __all__ entries, f-strings
# without placeholders. Everything beyond it is style, which the tests and
# review already cover; turning the rest on would be a migration, not a
# guard.
target-version = "py310"

[tool.ruff.lint]
# F is pyflakes: the class of bug this project keeps tripping on --
# undefined names, unused imports, dangling __all__ entries.
#
# B905 is the one rule outside it worth enforcing, because it is not
# style. A zip() over two sequences that are supposed to be the same
# length will, if they ever are not, silently stop at the shorter one --
# so a tool call gets announced and never answered, or a companion frame
# loses its bottom row, and nothing raises. Saying strict=True turns that
# into an exception at the point the invariant broke. The single place
# where unequal lengths are intended says so in a comment.
select = ["F", "B905"]
